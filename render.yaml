services:
  - type: web
    runtime: static
    name: off-axis
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://www.googletagmanager.com;
          connect-src 'self' https://api.web3forms.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;
          img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com;
          style-src 'self' 'unsafe-inline';
          font-src 'self';
          form-action 'self' https://api.web3forms.com;
          frame-ancestors 'none';
          base-uri 'self';
          object-src 'none'
      - path: /_assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=604800
    envVars:
      - key: PUBLIC_GA_MEASUREMENT_ID
        value: G-N1LVHW8ZNJ
      - key: PUBLIC_WEB3FORMS_ACCESS_KEY
        value: 1ecc1ab2-62a0-4244-9f60-2e8f692d6b7a
