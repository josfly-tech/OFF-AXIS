document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

und */\n    --ink-soft: #1B1916;   /* brand ink */\n    --paper:    #F1ECE2;   /* warm bone */\n    --paper-2:  #B8B1A4;   /* muted on dark */\n    --paper-3:  #6E675B;   /* faint on dark */\n    --line:     rgba(241,236,226,0.14);\n    --accent:   #B0542E;   /* clay */\n    --font-display:'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --font-mono:'Space Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;\n  }\n\n  *{ box-sizing:border-box; }\n  html,body{ height:100%; }\n  body{\n    margin:0;\n    background:var(--ink);\n    color:var(--paper);\n    font-family:var(--font-display);\n    -webkit-font-smoothing:antialiased;\n    text-rendering:optimizeLegibility;\n    overflow:hidden;\n  }\n  ::selection{ background:var(--accent); color:var(--paper); }\n\n  /* faint warm vignette so the centre lifts */\n  .stage{\n    position:fixed; inset:0;\n    display:flex; flex-direction:column;\n    align-items:center; justify-content:center;\n    padding:clamp(28px,6vw,64px);\n    background:\n      radial-gradient(120% 90% at 50% 42%, rgba(176,84,46,0.06) 0%, transparent 55%),\n      radial-gradient(140% 120% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);\n  }\n\n  /* ---- top + bottom field stamps ---- */\n  .corner{\n    position:fixed; left:0; right:0;\n    display:flex; justify-content:space-between; align-items:center;\n    padding:0 clamp(22px,5vw,52px);\n    font-family:var(--font-mono); font-size:11px;\n    letter-spacing:0.18em; text-transform:uppercase;\n    color:var(--paper-3);\n    opacity:0; animation:fade 1.9s ease .3s forwards;\n  }\n  .corner.top{ top:clamp(22px,5vh,40px); }\n  .corner.bot{ bottom:clamp(22px,5vh,40px); }\n  .corner .acc{ color:var(--accent); }\n  .corner a{ color:var(--paper-2); text-decoration:none; transition:color .25s ease; }\n  .corner a:hover{ color:var(--paper); }\n\n  /* ---- centre composition ---- */\n  .core{ text-align:center; max-width:760px; }\n\n  .pretitle{\n    font-family:var(--font-mono); font-size:12px;\n    letter-spacing:0.42em; text-transform:uppercase;\n    color:var(--paper-3); margin:0 0 clamp(30px,6vh,52px);\n    padding-left:0.42em;\n    opacity:0; animation:fade 1.8s ease .65s forwards;\n  }\n\n  .mark{\n    font-family:var(--font-mono); font-weight:700;\n    font-size:clamp(48px,12vw,150px);\n    letter-spacing:0.02em; line-height:0.9;\n    color:var(--paper); white-space:nowrap;\n    opacity:0; animation:rise 2.1s cubic-bezier(.2,.7,.2,1) 1s forwards;\n  }\n  .mark .sl{\n    color:var(--accent);\n    display:inline-block;\n    text-shadow:0 0 26px rgba(176,84,46,0.45);\n    cursor:pointer;\n    transition:transform .55s cubic-bezier(.2,.7,.2,1), text-shadow .55s ease, letter-spacing .55s ease;\n  }\n  /* hover: the off-axis line straightens to true vertical and flares */\n  .mark .sl:hover{\n    transform:rotate(-18.1deg) scale(1.14);\n    text-shadow:0 0 38px rgba(176,84,46,0.85), 0 0 10px rgba(176,84,46,0.6);\n  }\n\n  /* ---- the deviating axis ---- */\n  .axiswrap{\n    position:relative;\n    width:min(560px,76vw); height:64px;\n    margin:clamp(34px,6vh,56px) auto clamp(34px,6vh,56px);\n    opacity:0; animation:fade 2s ease 1.7s forwards;\n  }\n  .axis{\n    position:absolute; top:50%; left:0; right:0; height:1px;\n    transform-origin:50% 50%;\n    background:linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent);\n  }\n  .axis .node{\n    position:absolute; top:50%; left:50%;\n    width:7px; height:7px; margin:-3.5px 0 0 -3.5px;\n    background:var(--accent); border-radius:50%;\n    box-shadow:0 0 16px rgba(176,84,46,0.7);\n  }\n  .axis .tk{\n    position:absolute; top:50%; width:1px; height:9px; margin-top:-4.5px;\n    background:var(--paper-3);\n  }\n  .deg{\n    position:absolute; left:50%; top:calc(50% + 16px);\n    transform:translateX(-50%);\n    font-family:var(--font-mono); font-size:11px;\n    letter-spacing:0.16em; color:var(--accent);\n    white-space:nowrap;\n  }\n\n  .line{\n    font-size:clamp(19px,2.6vw,28px); font-weight:500;\n    letter-spacing:-0.01em; line-height:1.3;\n    color:var(--paper); margin:0;\n    opacity:0; animation:rise 1.8s cubic-bezier(.2,.7,.2,1) 2.1s forwards;\n  }\n  .line .accent-text{ color:var(--accent); }\n\n  .desc{\n    margin:clamp(14px,2.4vh,20px) auto 0;\n    max-width:30em;\n    font-size:clamp(13px,1.5vw,15.5px); font-weight:400;\n    letter-spacing:0.01em; line-height:1.5;\n    color:var(--paper-3);\n    text-wrap:balance;\n    opacity:0; animation:fade 1.8s ease 2.7s forwards;\n  }\n\n  .sub{\n    margin:clamp(22px,4vh,30px) 0 0;\n    font-family:var(--font-mono); font-size:12.5px;\n    letter-spacing:0.06em; color:var(--paper-2); line-height:1.6;\n    opacity:0; animation:fade 1.8s ease 3.1s forwards;\n  }\n  .sub a{ color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .25s ease; }\n  .sub a:hover{ border-color:var(--accent); }\n\n  /* ---- contact button (email assembled in JS, never in source) ---- */\n  .contact{\n    display:inline-flex; align-items:center; gap:9px;\n    margin:clamp(22px,4vh,30px) 0 0;\n    font-family:var(--font-mono); font-size:12px;\n    letter-spacing:0.18em; text-transform:uppercase;\n    color:var(--paper); background:transparent;\n    border:1px solid var(--line); border-radius:100px;\n    padding:13px 24px; cursor:pointer;\n    transition:border-color .3s ease, color .3s ease, background .3s ease, box-shadow .4s ease, transform .3s ease;\n    opacity:0; animation:fade 1.8s ease 3.1s forwards;\n  }\n  .contact .sl{ color:var(--accent); transition:transform .4s cubic-bezier(.2,.7,.2,1); display:inline-block; }\n  .contact:hover{\n    border-color:var(--accent); color:var(--paper);\n    background:rgba(176,84,46,0.10);\n    box-shadow:0 0 30px -6px rgba(176,84,46,0.6);\n    transform:translateY(-2px);\n  }\n  .contact:hover .sl{ transform:rotate(-18deg) scale(1.18); }\n  .contact:active{ transform:translateY(0); }\n\n  @keyframes fade{ to{ opacity:1; } }\n  @keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }\n\n  @media (prefers-reduced-motion: reduce){\n    *{ animation:none !important; }\n    .corner,.pretitle,.mark,.axiswrap,.line,.desc,.sub,.contact{ opacity:1 !important; transform:none !important; }\n  }\n\n  @media (max-width:560px){\n    .corner .r{ display:none; }\n    .core{ max-width:88vw; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <div class=\"corner top\">\n    <span>OFF<span class=\"acc\">/<\u002Fspan>AXIS<\u002Fspan>\n    <span class=\"r\">EST. <span class=\"acc\">2026<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n\n  <main class=\"stage\">\n    <div class=\"core\">\n      <p class=\"pretitle\">A change of angle<\u002Fp>\n\n      <div class=\"mark\">OFF<span class=\"sl\">/<\u002Fspan>AXIS<\u002Fdiv>\n\n      <div class=\"axiswrap\" aria-hidden=\"true\">\n        <div class=\"axis\" id=\"axis\">\n          <span class=\"tk\" style=\"left:14%\"><\u002Fspan>\n          <span class=\"tk\" style=\"left:32%\"><\u002Fspan>\n          <span class=\"tk\" style=\"left:68%\"><\u002Fspan>\n          <span class=\"tk\" style=\"left:86%\"><\u002Fspan>\n          <span class=\"node\"><\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"deg\" id=\"deg\">N 43.3°<\u002Fspan>\n      <\u002Fdiv>\n\n      <p class=\"line\">Every line begins <span class=\"accent-text\">off axis<\u002Fspan>.<\u002Fp>\n\n      <p class=\"desc\">Audience &amp; revenue Growth for sport, Outdoor &amp; culture-driven properties.<\u002Fp>\n\n      <p class=\"sub\">The new site is finding its line.<\u002Fp>\n\n      <button class=\"contact\" id=\"contact\" type=\"button\" aria-label=\"Get in touch by email\">Get in touch <span class=\"sl\">/<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <div class=\"corner bot\">\n    <span>N 43.3° · 03.6E · <a href=\"offaxis-legal.html\">Legal notice<\u002Fa><\u002Fspan>\n    <span class=\"r\">FINDING NEW LINES OF GROWTH<\u002Fspan>\n  <\u002Fdiv>\n\n\n\n<script>\n(function(){\n  // Email assembled at runtime so it never appears as plaintext in the source\n  // (keeps it off scrapers / spam bots). Opens the normal mail client on click.\n  var b = document.getElementById('contact');\n  if(b){\n    var user = 'joseph', domain = 'offaxis' + '.' + 'partners';\n    var subject = 'Off Axis \\u2014 hello';\n    b.addEventListener('click', function(){\n      window.location.href = 'mailto:' + user + '@' + domain + '?subject=' + encodeURIComponent(subject);\n    });\n  }\n})();\n<\u002Fscript>\n<script>\n(function(){\n  var axis = document.getElementById('axis');\n  var deg  = document.getElementById('deg');\n  if(!axis || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  var t0 = performance.now();\n  function frame(now){\n    var t = (now - t0) / 1000;\n    // gentle deviation: the axis drifts a few degrees off true, never settling\n    var a = Math.sin(t * 0.34) * 7.2 + Math.sin(t * 0.11) * 1.8;\n    axis.style.transform = 'rotate(' + a.toFixed(2) + 'deg)';\n    var val = 43.3 + a * 0.42;\n    deg.textContent = 'N ' + val.toFixed(1) + '\\u00B0';\n    requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
